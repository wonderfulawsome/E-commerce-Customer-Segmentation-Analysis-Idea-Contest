name: Keep Streamlit Alive (Browser)

on:
  schedule:
    - cron: "*/20 * * * *"  # 20분마다 실행 (15~30분 사이 안전 구간)
  workflow_dispatch:

jobs:
  browser-visit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Selenium
        run: |
          pip install selenium webdriver-manager

      - name: Visit App with Headless Chrome
        shell: python
        run: |
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager
          import time

          # 1. 브라우저 설정 (Headless 모드: 화면 없이 실행)
          chrome_options = Options()
          chrome_options.add_argument("--headless") 
          chrome_options.add_argument("--no-sandbox")
          chrome_options.add_argument("--disable-dev-shm-usage")
          
          # 사람인 척 위장 (User-Agent 설정)
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
          chrome_options.add_argument(f'user-agent={user_agent}')

          # 2. 브라우저 실행
          service = Service(ChromeDriverManager().install())
          driver = webdriver.Chrome(service=service, options=chrome_options)

          try:
              print("🚀 Streamlit 앱 접속 시작...")
              driver.get("https://8ug2zd7qzwdj5u24nom335.streamlit.app/")
              
              # 3. 페이지 로딩 대기 (중요: JS 실행 및 웹소켓 연결 시간 확보)
              time.sleep(10)
              
              print(f"✅ 접속 성공! 페이지 제목: {driver.title}")
              
              # 4. 추가 체류 (확실하게 활동 로그 남기기)
              time.sleep(20) 
              
          except Exception as e:
              print(f"❌ 접속 중 오류 발생: {e}")
              exit(1)
          finally:
              driver.quit()
              print("👋 브라우저 종료")
